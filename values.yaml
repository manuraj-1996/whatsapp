metadata:
  deployment:
    app: ecommerce-deployment
  service:
    app: ecommerce-service
replicaCount: 1
image: 818111884800.dkr.ecr.us-east-1.amazonaws.com/ecommerce:1.0
port:
  containerPort: 8081
probes:
  path: /health
  port: 8081
  initialDelaySeconds: 10
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5
configMap:
  name: app-config
  data:
    DB_URL: "jdbc:postgresql://postgres-service:5432/ecommercedb"
    DB_USERNAME: "postgres"
secret:
  name: ecommerce-db-secret
  data:
    DB_PASSWORD: "secret"
resources:
  cpu: "100m"
  memory: "256Mi"
  limit:
    cpu: "500m"
    memory: "512Mi" 

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

serviceAccount:
  create: true